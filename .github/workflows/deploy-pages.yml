name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "22"

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Stage Pages artifact
        run: |
          rm -rf .site
          mkdir -p .site
          cp index.html \
            favicon.svg \
            geo.txt \
            llms.txt \
            llms-full.txt \
            metadata.json \
            robots.txt \
            schema.jsonld \
            sitemap.xml \
            agent-context.md \
            google-site-verification.txt \
            google9a05bdeaa5b048bb.html \
            .site/
          cp docs/404.html .site/404.html
          cp -R docs .site/docs
          cp -R projects .site/projects
          : > .site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
