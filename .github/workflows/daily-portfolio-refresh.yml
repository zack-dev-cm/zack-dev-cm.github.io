name: Daily Portfolio Refresh

on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.DEV_CM_GITHUB_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Install dependencies
        run: npm ci

      - name: Refresh ClawHub snapshot
        id: clawhub
        continue-on-error: true
        run: npm run stats:clawhub -- --write

      - name: Refresh public GitHub update feed
        id: github-feed
        continue-on-error: true
        env:
          DEV_CM_GITHUB_TOKEN: ${{ secrets.DEV_CM_GITHUB_TOKEN || github.token }}
        run: npm run sync:github -- --write

      - name: Refresh paper review
        id: papers
        continue-on-error: true
        run: npm run papers:review -- --write --allow-noop

      - name: Refresh Chrome Web Store snapshot
        id: chrome-store
        continue-on-error: true
        run: npm run stats:chrome -- --write

      - name: Report refresh results
        env:
          CLAWHUB_RESULT: ${{ steps.clawhub.outcome }}
          GITHUB_FEED_RESULT: ${{ steps.github-feed.outcome }}
          PAPER_RESULT: ${{ steps.papers.outcome }}
          CHROME_STORE_RESULT: ${{ steps.chrome-store.outcome }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const results = [['ClawHub', process.env.CLAWHUB_RESULT], ['GitHub feed', process.env.GITHUB_FEED_RESULT], ['Paper review', process.env.PAPER_RESULT], ['Chrome Web Store', process.env.CHROME_STORE_RESULT]];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '| Source | Result |\n| --- | --- |\n' + results.map(([name, result]) => `| ${name} | ${result} |`).join('\n') + '\n\nFailed sources retain their previous dated snapshot. Successful sources proceed through all release checks.\n');
          if (results.every(([, result]) => result !== 'success')) process.exit(1);
          JS

      - name: Validate portfolio source
        run: npm run validate

      - name: Check catalogue and deployment regressions
        run: node --test tests/project-catalog.test.mjs tests/project-search.test.mjs tests/stage-pages.test.mjs tests/disclosure-guard.test.mjs tests/clawhub-stats.test.mjs tests/daily-refresh.test.mjs tests/refresh-reliability.test.mjs

      - name: Build site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E checks
        run: PLAYWRIGHT_SKIP_BUILD=true npm run test:e2e

      - name: Run release security gate
        run: npm run security:gate

      - name: Run Codex public-surface audit
        run: npm run audit:codex

      - name: Check public links
        run: npm run check:links

      - name: Commit refreshed public files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A constants.ts index.html llms.txt llms-full.txt agent-context.md agent-discovery.json geo.txt schema.jsonld sitemap.xml metadata.json public/portfolio-updates.json public/paper-reviews.json public/chrome-extension-stats.json public/images/project-social public/images/portfolio-social-card-ml-ai-products.png docs projects
          if git diff --cached --quiet; then
            echo "Only non-public files changed; skipping commit."
            exit 0
          fi
          git commit -m "chore: refresh portfolio stats and updates"
          git push

      - name: Stage Pages artifact
        run: node scripts/stage-pages.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .site

      - name: Verify publication is still current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_publication_sha=$(git rev-parse HEAD)
          current_publication_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$expected_publication_sha" != "$current_publication_sha" ]; then
            echo "A newer main commit superseded this artifact; refusing to publish it."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
