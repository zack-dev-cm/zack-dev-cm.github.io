name: Daily Portfolio Refresh

on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-portfolio-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.DEV_CM_GITHUB_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Install dependencies
        run: npm ci

      - name: Refresh stats and public update feed
        env:
          DEV_CM_GITHUB_TOKEN: ${{ secrets.DEV_CM_GITHUB_TOKEN || github.token }}
        run: |
          npm run stats:clawhub -- --write
          npm run sync:github -- --write
          npm run papers:review -- --write --allow-noop

      - name: Validate portfolio source
        run: npm run validate

      - name: Check catalogue and deployment regressions
        run: node --test tests/project-catalog.test.mjs tests/project-search.test.mjs tests/stage-pages.test.mjs

      - name: Build site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E checks
        run: PLAYWRIGHT_SKIP_BUILD=true npm run test:e2e

      - name: Run release security gate
        run: npm run security:gate

      - name: Run Codex public-surface audit
        run: npm run audit:codex

      - name: Check public links
        run: npm run check:links

      - name: Commit refreshed public files
        run: |
          if git diff --quiet; then
            echo "No source-backed portfolio changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A constants.ts public/portfolio-updates.json public/paper-reviews.json docs projects
          if git diff --cached --quiet; then
            echo "Only non-public files changed; skipping commit."
            exit 0
          fi
          git commit -m "chore: refresh portfolio stats and updates"
          git push

      - name: Stage Pages artifact
        run: node scripts/stage-pages.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
