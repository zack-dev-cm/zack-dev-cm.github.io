<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ClearML experiment tracking card for Dermaself</title>
  <desc id="desc">Public-safe MLOps card showing Dermaself computer vision experiments, run tracking, metrics, artifacts, QA gates, and promotion boundaries.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcf8"/>
      <stop offset="0.58" stop-color="#eff8f6"/>
      <stop offset="1" stop-color="#f8f2e7"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#159a9c"/>
      <stop offset="1" stop-color="#16636f"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5b849"/>
      <stop offset="1" stop-color="#d97917"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17202a"/>
      <stop offset="1" stop-color="#273547"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#14202c" flood-opacity="0.13"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14202c" flood-opacity="0.11"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d9e7e4" stroke-width="1" opacity="0.55"/>
    </pattern>
    <style>
      .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 42px; font-weight: 760; letter-spacing: 0; fill: #17202a; }
      .subtitle { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; font-weight: 620; letter-spacing: 0; fill: #526170; }
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 720; letter-spacing: 0.2px; fill: #203040; }
      .small { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 680; letter-spacing: 0.2px; fill: #5a6875; }
      .tiny { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.25px; fill: #667382; }
      .panel { fill: #ffffff; stroke: #d8e2df; stroke-width: 1.5; }
      .soft { fill: #f6fbfa; stroke: #d8e2df; stroke-width: 1.3; }
      .line { stroke: #c8d7d4; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .flow { stroke: #159a9c; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .flowAmber { stroke: #e19a24; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#surface)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#grid)" opacity="0.58"/>

  <g transform="translate(94 72)">
    <rect x="0" y="0" width="1412" height="756" rx="30" fill="#ffffff" opacity="0.74" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1412" height="756" rx="30" fill="#fbfdfc" stroke="#dbe5e2" stroke-width="1.5"/>

    <g transform="translate(54 42)">
      <rect x="0" y="0" width="214" height="42" rx="21" fill="#e5f5f3" stroke="#bdddd8"/>
      <circle cx="31" cy="21" r="8" fill="#159a9c"/>
      <text x="50" y="27" class="small">DERMASELF MLOPS</text>
      <text x="0" y="96" class="title">ClearML experiment tracking</text>
      <text x="0" y="128" class="subtitle">Public-safe run history, artifact review, and promotion gates for skin-analysis model work</text>
    </g>

    <g transform="translate(54 190)">
      <rect class="panel" x="0" y="0" width="314" height="548" rx="22" filter="url(#smallShadow)"/>
      <text x="28" y="48" class="label">MOBILE CV PIPELINE</text>
      <rect x="34" y="82" width="156" height="304" rx="28" fill="#182433"/>
      <rect x="47" y="108" width="130" height="246" rx="18" fill="#f4f8f7"/>
      <circle cx="112" cy="212" r="54" fill="#d9ece9"/>
      <path d="M112 154 C146 162 161 190 157 220 C153 264 132 291 112 292 C89 291 70 264 67 221 C64 189 78 162 112 154Z" fill="#f7efe8" stroke="#9fc2bd" stroke-width="2"/>
      <path d="M76 221 C92 211 128 211 145 221" class="line"/>
      <path d="M87 242 C104 252 126 252 139 242" class="line"/>
      <path d="M88 198 C100 192 118 192 130 198" stroke="#159a9c" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M81 260 C103 274 133 273 149 260" stroke="#e19a24" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="68" y="318" width="88" height="9" rx="4.5" fill="#cbd8d6"/>
      <rect x="80" y="333" width="64" height="8" rx="4" fill="#d8e3e1"/>
      <g transform="translate(212 86)">
        <rect class="soft" x="0" y="0" width="74" height="74" rx="14"/>
        <path d="M17 50 L31 35 L43 43 L56 23" stroke="#159a9c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect class="soft" x="0" y="92" width="74" height="74" rx="14"/>
        <path d="M19 26 H54 M19 38 H46 M19 50 H58" stroke="#d97917" stroke-width="5" stroke-linecap="round"/>
        <rect class="soft" x="0" y="184" width="74" height="74" rx="14"/>
        <circle cx="26" cy="36" r="10" fill="#159a9c"/>
        <circle cx="48" cy="36" r="10" fill="#f0b849"/>
        <path d="M20 54 H56" stroke="#c2d3d0" stroke-width="5" stroke-linecap="round"/>
      </g>
      <g transform="translate(30 430)">
        <text x="0" y="0" class="small">SANITIZED PUBLIC BOUNDARY</text>
        <rect x="0" y="25" width="254" height="10" rx="5" fill="#dae6e3"/>
        <rect x="0" y="51" width="218" height="10" rx="5" fill="#e3ebe9"/>
        <rect x="0" y="77" width="236" height="10" rx="5" fill="#e3ebe9"/>
      </g>
    </g>

    <g transform="translate(424 220)">
      <path class="flow" d="M0 210 H80"/>
      <path d="M72 196 L88 210 L72 224" stroke="#159a9c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(512 190)">
      <rect class="panel" x="0" y="0" width="472" height="548" rx="22" filter="url(#smallShadow)"/>
      <text x="30" y="48" class="label">TRACKING LAYER</text>
      <text x="300" y="48" class="small">RUNS + ARTIFACTS</text>

      <g transform="translate(30 78)">
        <rect class="soft" x="0" y="0" width="186" height="150" rx="18"/>
        <text x="20" y="34" class="small">DATASET VERSION</text>
        <rect x="22" y="58" width="132" height="10" rx="5" fill="#cbd8d6"/>
        <rect x="22" y="83" width="154" height="10" rx="5" fill="#e1e9e7"/>
        <rect x="22" y="108" width="116" height="10" rx="5" fill="#e1e9e7"/>
        <circle cx="156" cy="110" r="16" fill="#e5f5f3" stroke="#9acbc5"/>
        <path d="M148 110 L154 116 L166 101" stroke="#159a9c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g transform="translate(246 78)">
        <rect class="soft" x="0" y="0" width="186" height="150" rx="18"/>
        <text x="20" y="34" class="small">PARAMETERS</text>
        <path d="M24 64 H158" stroke="#c9d8d5" stroke-width="6" stroke-linecap="round"/>
        <circle cx="96" cy="64" r="13" fill="#159a9c"/>
        <path d="M24 95 H158" stroke="#c9d8d5" stroke-width="6" stroke-linecap="round"/>
        <circle cx="122" cy="95" r="13" fill="#f0b849"/>
        <path d="M24 126 H158" stroke="#c9d8d5" stroke-width="6" stroke-linecap="round"/>
        <circle cx="72" cy="126" r="13" fill="#26394d"/>
      </g>

      <g transform="translate(30 260)">
        <rect class="soft" x="0" y="0" width="186" height="188" rx="18"/>
        <text x="20" y="34" class="small">METRIC TRENDS</text>
        <path d="M25 146 H163 M25 62 V146" stroke="#d0dfdc" stroke-width="2" fill="none"/>
        <path d="M30 124 C52 110 68 118 84 94 C104 62 127 89 154 50" stroke="#159a9c" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M30 134 C55 128 70 139 91 115 C112 92 132 116 156 83" stroke="#e19a24" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>
      </g>

      <g transform="translate(246 260)">
        <rect class="soft" x="0" y="0" width="186" height="188" rx="18"/>
        <text x="20" y="34" class="small">ARTIFACTS</text>
        <rect x="20" y="58" width="68" height="52" rx="10" fill="#e5f5f3" stroke="#afd7d1"/>
        <path d="M34 90 L48 77 L58 85 L72 68" stroke="#159a9c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="98" y="58" width="68" height="52" rx="10" fill="#fbefd8" stroke="#efcc8d"/>
        <path d="M113 72 H151 M113 87 H142 M113 102 H156" stroke="#d97917" stroke-width="4" stroke-linecap="round"/>
        <rect x="20" y="126" width="146" height="11" rx="5.5" fill="#d8e3e1"/>
        <rect x="20" y="150" width="112" height="11" rx="5.5" fill="#e4ebe9"/>
      </g>
    </g>

    <g transform="translate(1016 438)">
      <path class="flowAmber" d="M0 0 H78"/>
      <path d="M70 -14 L86 0 L70 14" stroke="#e19a24" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(1102 190)">
      <rect class="panel" x="0" y="0" width="310" height="548" rx="22" filter="url(#smallShadow)"/>
      <text x="30" y="48" class="label">QA PROMOTION GATE</text>

      <g transform="translate(34 86)">
        <rect x="0" y="0" width="242" height="116" rx="18" fill="#172433"/>
        <circle cx="58" cy="58" r="30" fill="#e5f5f3" opacity="0.95"/>
        <path d="M44 57 L56 69 L78 42" stroke="#159a9c" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="104" y="36" width="104" height="10" rx="5" fill="#d3ddd9"/>
        <rect x="104" y="59" width="76" height="10" rx="5" fill="#556270"/>
        <rect x="104" y="82" width="122" height="10" rx="5" fill="#556270"/>
      </g>

      <g transform="translate(34 238)">
        <rect class="soft" x="0" y="0" width="242" height="184" rx="18"/>
        <text x="22" y="35" class="small">REVIEW CHECKS</text>
        <g transform="translate(22 62)">
          <circle cx="9" cy="9" r="9" fill="#159a9c"/>
          <path d="M4 9 L8 13 L15 5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="31" y="4" width="154" height="10" rx="5" fill="#cbd8d6"/>
        </g>
        <g transform="translate(22 98)">
          <circle cx="9" cy="9" r="9" fill="#159a9c"/>
          <path d="M4 9 L8 13 L15 5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="31" y="4" width="176" height="10" rx="5" fill="#cbd8d6"/>
        </g>
        <g transform="translate(22 134)">
          <circle cx="9" cy="9" r="9" fill="#e19a24"/>
          <rect x="31" y="4" width="129" height="10" rx="5" fill="#cbd8d6"/>
        </g>
      </g>

      <g transform="translate(34 456)">
        <rect x="0" y="0" width="242" height="68" rx="18" fill="#e9f6f4" stroke="#b8d9d4"/>
        <text x="24" y="30" class="small">PROMOTION DECISION</text>
        <rect x="24" y="43" width="155" height="9" rx="4.5" fill="#9bcac4"/>
        <circle cx="208" cy="34" r="16" fill="url(#amber)"/>
      </g>
    </g>
  </g>

  <g transform="translate(116 820)">
    <rect x="0" y="0" width="340" height="42" rx="21" fill="#172433"/>
    <circle cx="29" cy="21" r="8" fill="#159a9c"/>
    <text x="48" y="27" class="small" fill="#eaf2f0">NO RAW PHOTOS OR PRIVATE WORKSPACES</text>
  </g>
</svg>
