<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zakhar Pashkin - AI & Computer Vision Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const bootstrap = async () => {
        const hostname = window.location.hostname || '';
        const isLocalhost = ['localhost', '127.0.0.1', '::1', ''].includes(hostname);

        if (isLocalhost) {
          await import('/index.tsx');
          return;
        }

        const root = document.getElementById('root');
        const showError = (msg) => {
          console.error(msg);
          if (root && root.childNodes.length === 0) {
            root.textContent = 'Unable to load site assets. Please try again later.';
          }
        };

        const loadFromManifest = async () => {
          const manifestResponse = await fetch('./manifest.json', { cache: 'no-store' });
          if (!manifestResponse.ok) {
            throw new Error(`Failed to load manifest: ${manifestResponse.status}`);
          }

          const manifest = await manifestResponse.json();
          const entry = manifest['index.html'];
          const cssEntries = manifest['index.tsx']?.css || [];

          cssEntries.forEach((cssPath) => {
            const linkEl = document.createElement('link');
            linkEl.rel = 'stylesheet';
            linkEl.href = `./${cssPath}`;
            document.head.appendChild(linkEl);
          });

          if (!entry?.file) {
            throw new Error('Manifest missing entry file.');
          }

          const scriptEl = document.createElement('script');
          scriptEl.type = 'module';
          scriptEl.src = `./${entry.file}`;
          document.body.appendChild(scriptEl);
        };

        const loadFromBuiltIndex = async () => {
          const docsIndexResponse = await fetch('./index.html', { cache: 'no-store' });
          if (!docsIndexResponse.ok) {
            throw new Error(`Failed to load built index.html: ${docsIndexResponse.status}`);
          }

          const htmlText = await docsIndexResponse.text();
          const parser = new DOMParser();
          const parsedDocument = parser.parseFromString(htmlText, 'text/html');

          parsedDocument.querySelectorAll('link[rel="stylesheet"]').forEach((sourceLink) => {
            const linkEl = document.createElement('link');
            linkEl.rel = 'stylesheet';
            linkEl.href = sourceLink.getAttribute('href');
            document.head.appendChild(linkEl);
          });

          const builtScript = parsedDocument.querySelector('script[type="module"]');
          if (!builtScript) {
            throw new Error('Unable to locate built module script tag.');
          }
          const src = builtScript.getAttribute('src');
          if (!src) {
            throw new Error('Built module script is missing a src attribute.');
          }

          const scriptEl = document.createElement('script');
          scriptEl.type = 'module';
          scriptEl.src = src;
          if (builtScript.hasAttribute('crossorigin')) {
            scriptEl.crossOrigin = builtScript.getAttribute('crossorigin') || '';
          }
          document.body.appendChild(scriptEl);
        };

        try {
          await loadFromManifest().catch(async (e) => {
            console.warn('Manifest load failed, falling back to built index.', e);
            await loadFromBuiltIndex();
          });
        } catch (error) {
          showError(error);
        }
      };

      bootstrap().catch((error) => {
        console.error('Failed to bootstrap application', error);
        const root = document.getElementById('root');
        if (root && root.childNodes.length === 0) {
          root.textContent = 'An unexpected error occurred while loading the site.';
        }
      });
    </script>
  </body>
</html>
