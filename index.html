<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zakhar Pashkin - AI & Computer Vision Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const joinPaths = (base, path) => {
        const normalizedBase = (base || '.').replace(/\/+$/, '') || '.';
        const normalizedPath = (path || '').replace(/^\.?\//, '');
        return `${normalizedBase}/${normalizedPath}`;
      };

      const tryAssetBases = async (loader) => {
        const bases = ['./docs', './'];
        let lastError = null;

        for (const base of bases) {
          try {
            await loader(base);
            return;
          } catch (error) {
            lastError = error;
          }
        }

        if (lastError) {
          throw lastError;
        }
      };

      const bootstrap = async () => {
        const isDev = typeof import.meta !== 'undefined' && import.meta?.env?.DEV;

        if (isDev) {
          await import('/index.tsx');
          return;
        }

        const root = document.getElementById('root');
        const showError = (msg) => {
          console.error(msg);
          if (root && root.childNodes.length === 0) {
            root.textContent = 'Unable to load site assets. Please try again later.';
          }
        };

        const findAppEntry = (manifest) => {
          const candidates = ['index.tsx', 'src/index.tsx', 'main.tsx', 'src/main.tsx'];
          for (const key of candidates) {
            if (manifest[key]?.file) {
              return manifest[key];
            }
          }

          const indexHtmlEntry = manifest['index.html'];
          if (indexHtmlEntry?.dynamicImports?.length) {
            const fallbackKey = indexHtmlEntry.dynamicImports[0];
            if (manifest[fallbackKey]?.file) {
              return manifest[fallbackKey];
            }
          }

          return Object.values(manifest).find((entry) => entry?.isEntry && entry.file) || null;
        };

        const loadScript = (src) => new Promise((resolve, reject) => {
          const scriptEl = document.createElement('script');
          scriptEl.type = 'module';
          scriptEl.src = src;
          scriptEl.onload = resolve;
          scriptEl.onerror = () => reject(new Error(`Failed to load app bundle (${src}).`));
          document.body.appendChild(scriptEl);
        });

        const loadFromManifest = async (assetBase) => {
          const manifestUrl = joinPaths(assetBase, 'manifest.json');
          const manifestResponse = await fetch(manifestUrl, { cache: 'no-store' });
          if (!manifestResponse.ok) {
            throw new Error(`Failed to load manifest (${manifestUrl}): ${manifestResponse.status}`);
          }

          const manifest = await manifestResponse.json();
          const entry = findAppEntry(manifest);

          if (!entry?.file) {
            throw new Error('Manifest missing app entry file.');
          }

          const cssEntries = entry.css || [];

          cssEntries.forEach((cssPath) => {
            const linkEl = document.createElement('link');
            linkEl.rel = 'stylesheet';
            linkEl.href = joinPaths(assetBase, cssPath);
            document.head.appendChild(linkEl);
          });

          await loadScript(joinPaths(assetBase, entry.file));
        };

        try {
          await tryAssetBases(loadFromManifest);
        } catch (manifestError) {
          console.warn('Manifest load failed.', manifestError);
          showError(manifestError);
        }
      };

      bootstrap().catch((error) => {
        console.error('Failed to bootstrap application', error);
        const root = document.getElementById('root');
        if (root && root.childNodes.length === 0) {
          root.textContent = 'An unexpected error occurred while loading the site.';
        }
      });
    </script>
  </body>
</html>
