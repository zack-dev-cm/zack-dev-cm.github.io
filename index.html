<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zakhar Pashkin - AI & Computer Vision Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const bootstrap = async () => {
        const hostname = window.location.hostname || '';
        const isLocalhost = ['localhost', '127.0.0.1', '::1', ''].includes(hostname);

        if (isLocalhost) {
          await import('/index.tsx');
          return;
        }

        // On production, just serve the built site from /docs to avoid loader issues.
        window.location.replace('./docs/');
        return;

        const docsIndexResponse = await fetch('./docs/index.html', { cache: 'no-store' });
        if (!docsIndexResponse.ok) {
          console.error('Failed to load built index.html', docsIndexResponse.status, docsIndexResponse.statusText);
          const root = document.getElementById('root');
          if (root && root.childNodes.length === 0) {
            root.textContent = 'Unable to load site assets. Please try again later.';
          }
          return;
        }

        const htmlText = await docsIndexResponse.text();
        const parser = new DOMParser();
        const parsedDocument = parser.parseFromString(htmlText, 'text/html');
        const docsBaseUrl = new URL('./docs/', window.location.href);

        const transferLink = (sourceLink) => {
          const href = sourceLink.getAttribute('href');
          if (!href) {
            return;
          }
          const resolvedUrl = new URL(href, docsBaseUrl);
          const linkEl = document.createElement('link');
          linkEl.rel = sourceLink.getAttribute('rel') || 'stylesheet';
          if (sourceLink.hasAttribute('crossorigin')) {
            linkEl.crossOrigin = sourceLink.getAttribute('crossorigin') || '';
          }
          linkEl.href = resolvedUrl.pathname + resolvedUrl.search + resolvedUrl.hash;
          document.head.appendChild(linkEl);
        };

        parsedDocument.querySelectorAll('link[rel="stylesheet"]').forEach(transferLink);

        const builtScript = parsedDocument.querySelector('script[type="module"]');
        if (!builtScript) {
          console.error('Unable to locate built module script tag.');
          const root = document.getElementById('root');
          if (root && root.childNodes.length === 0) {
            root.textContent = 'Client bundle not found in built output.';
          }
          return;
        }

        const src = builtScript.getAttribute('src');
        if (!src) {
          console.error('Built module script is missing a src attribute.');
          const root = document.getElementById('root');
          if (root && root.childNodes.length === 0) {
            root.textContent = 'Client bundle src attribute missing.';
          }
          return;
        }

        const resolvedScriptUrl = new URL(src, docsBaseUrl);
        const scriptEl = document.createElement('script');
        scriptEl.type = 'module';
        scriptEl.src = resolvedScriptUrl.pathname + resolvedScriptUrl.search + resolvedScriptUrl.hash;
        if (builtScript.hasAttribute('crossorigin')) {
          scriptEl.crossOrigin = builtScript.getAttribute('crossorigin') || '';
        }
        document.body.appendChild(scriptEl);
      };

      bootstrap().catch((error) => {
        console.error('Failed to bootstrap application', error);
        const root = document.getElementById('root');
        if (root && root.childNodes.length === 0) {
          root.textContent = 'An unexpected error occurred while loading the site.';
        }
      });
    </script>
  </body>
</html>
