<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agnitra AI inference optimizer public-safe project card</title>
  <desc id="desc">A public-safe product card showing decoder-only LLM inference optimization, quantization choices, integrations, signed manifests, and package-release source surfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102136"/>
      <stop offset="0.48" stop-color="#143b46"/>
      <stop offset="1" stop-color="#28323a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46d6a4"/>
      <stop offset="0.55" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#8ec5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#07111c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 760 C260 690 430 780 650 720 C880 658 1030 608 1260 650 C1410 678 1500 704 1600 682 L1600 900 L0 900 Z" fill="#081723" opacity="0.42"/>
  <path d="M120 170 L1480 170" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.95"/>

  <g transform="translate(110 82)">
    <text x="0" y="0" fill="#d9fff3" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Agnitra AI</text>
    <text x="0" y="56" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="800">LLM Inference Optimizer</text>
    <text x="0" y="104" fill="#b9d6dd" font-family="Inter, Arial, sans-serif" font-size="25">Public package surface: PyPI release, SDK contract, integrations, and signed manifests.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="115" y="230" width="430" height="545" rx="8" fill="url(#panel)" stroke="#7bdcc4" stroke-opacity="0.36"/>
    <rect x="595" y="230" width="430" height="545" rx="8" fill="url(#panel)" stroke="#ffd166" stroke-opacity="0.34"/>
    <rect x="1075" y="230" width="410" height="545" rx="8" fill="url(#panel)" stroke="#8ec5ff" stroke-opacity="0.34"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="150" y="292" fill="#8bf0d0" font-size="27" font-weight="800">Runtime Entry</text>
    <text x="150" y="336" fill="#ffffff" font-size="23" font-weight="700">Decoder-only LLM</text>
    <text x="150" y="376" fill="#b9d6dd" font-size="20">HuggingFace-style wrapper</text>
    <text x="150" y="414" fill="#b9d6dd" font-size="20">Same generate() contract</text>
    <text x="150" y="452" fill="#b9d6dd" font-size="20">Unsupported models pass through</text>
    <rect x="150" y="500" width="300" height="64" rx="8" fill="#06151f" stroke="#6fe0bf" stroke-opacity="0.5"/>
    <text x="176" y="540" fill="#eafff8" font-size="20" font-weight="700">AgnitraModel.from_pretrained</text>
    <rect x="150" y="596" width="300" height="64" rx="8" fill="#06151f" stroke="#6fe0bf" stroke-opacity="0.5"/>
    <text x="176" y="636" fill="#eafff8" font-size="20" font-weight="700">optimize_pipeline()</text>
    <rect x="150" y="692" width="300" height="64" rx="8" fill="#06151f" stroke="#6fe0bf" stroke-opacity="0.5"/>
    <text x="176" y="732" fill="#eafff8" font-size="20" font-weight="700">trust verify manifest</text>

    <text x="630" y="292" fill="#ffe4a1" font-size="27" font-weight="800">Optimization Layer</text>
    <text x="630" y="336" fill="#ffffff" font-size="23" font-weight="700">Quantization Choices</text>
    <g fill="#fff6d9" font-size="20" font-weight="700">
      <text x="660" y="399">INT8 weight</text>
      <text x="660" y="477">INT4 weight</text>
      <text x="660" y="555">FP8 weight</text>
      <text x="660" y="633">auto routing</text>
    </g>
    <g stroke="#ffd166" stroke-width="3" opacity="0.85">
      <path d="M620 384 H930"/>
      <path d="M620 462 H930"/>
      <path d="M620 540 H930"/>
      <path d="M620 618 H930"/>
    </g>
    <circle cx="630" cy="384" r="10" fill="#46d6a4"/>
    <circle cx="630" cy="462" r="10" fill="#ffd166"/>
    <circle cx="630" cy="540" r="10" fill="#8ec5ff"/>
    <circle cx="630" cy="618" r="10" fill="#ffffff"/>
    <text x="630" y="706" fill="#b9d6dd" font-size="20">Bounded public claim: package metadata,</text>
    <text x="630" y="736" fill="#b9d6dd" font-size="20">release notes, and documented integrations.</text>

    <text x="1110" y="292" fill="#b9ddff" font-size="27" font-weight="800">Public Sources</text>
    <rect x="1110" y="330" width="290" height="74" rx="8" fill="#071827" stroke="#8ec5ff" stroke-opacity="0.55"/>
    <text x="1134" y="376" fill="#ffffff" font-size="22" font-weight="800">PyPI: agnitra 0.2.4</text>
    <rect x="1110" y="430" width="290" height="74" rx="8" fill="#071827" stroke="#8ec5ff" stroke-opacity="0.55"/>
    <text x="1134" y="476" fill="#ffffff" font-size="22" font-weight="800">Apache-2.0 metadata</text>
    <rect x="1110" y="530" width="290" height="74" rx="8" fill="#071827" stroke="#8ec5ff" stroke-opacity="0.55"/>
    <text x="1134" y="576" fill="#ffffff" font-size="22" font-weight="800">Beta classifier</text>
    <rect x="1110" y="630" width="290" height="74" rx="8" fill="#071827" stroke="#8ec5ff" stroke-opacity="0.55"/>
    <text x="1134" y="676" fill="#ffffff" font-size="22" font-weight="800">PyPI publisher profile</text>
    <text x="1110" y="732" fill="#b9d6dd" font-size="19">No unpublished source links, keys,</text>
    <text x="1110" y="760" fill="#b9d6dd" font-size="19">customer models, or unpublished claims.</text>
  </g>

  <g stroke="url(#accent)" stroke-width="8" stroke-linecap="round" opacity="0.82">
    <path d="M540 500 C574 500 574 500 595 500"/>
    <path d="M1024 500 C1054 500 1054 500 1075 500"/>
  </g>
</svg>
