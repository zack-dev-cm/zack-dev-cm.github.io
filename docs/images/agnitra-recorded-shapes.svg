<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">Agnitra: recorded model shapes</title>
<desc id="desc">Actual output from profiling a small randomly initialized ConvNet on CPU with Agnitra 0.2.4. Five layers: convolution, ReLU, average pooling, flatten and linear. This demonstrates profiling, not optimization performance.</desc>
<rect width="960" height="620" rx="12" fill="#f7f8fa"/>
<g font-family="Arial, sans-serif" fill="#17202a">
<text x="42" y="46" font-size="15" fill="#186078" letter-spacing="1.4">AGNITRA / RECORDED OUTPUT</text>
<text x="42" y="94" font-size="34" font-weight="700">Model shapes, layer by layer</text>
<text x="42" y="128" font-size="19" fill="#526273">CPU profiling example · Agnitra 0.2.4 · PyTorch 2.9.1</text>
<path d="M42 158H918" stroke="#cbd4dd"/>
<text x="42" y="194" font-size="14" fill="#526273" letter-spacing="1">LAYER</text>
<text x="352" y="194" font-size="14" fill="#526273" letter-spacing="1">INPUT SHAPE</text>
<text x="650" y="194" font-size="14" fill="#526273" letter-spacing="1">OUTPUT SHAPE</text>
<text x="42" y="241" font-size="22" font-weight="700">Conv2d</text>
<text x="352" y="241" font-size="21" font-family="monospace">1 × 3 × 32 × 32</text>
<text x="650" y="241" font-size="21" font-family="monospace">1 × 8 × 32 × 32</text>
<path d="M42 260H918" stroke="#dce2e7"/>
<text x="42" y="296" font-size="22" font-weight="700">ReLU</text>
<text x="352" y="296" font-size="21" font-family="monospace">1 × 8 × 32 × 32</text>
<text x="650" y="296" font-size="21" font-family="monospace">1 × 8 × 32 × 32</text>
<path d="M42 315H918" stroke="#dce2e7"/>
<text x="42" y="351" font-size="22" font-weight="700">AdaptiveAvgPool2d</text>
<text x="352" y="351" font-size="21" font-family="monospace">1 × 8 × 32 × 32</text>
<text x="650" y="351" font-size="21" font-family="monospace">1 × 8 × 1 × 1</text>
<path d="M42 370H918" stroke="#dce2e7"/>
<text x="42" y="406" font-size="22" font-weight="700">Flatten</text>
<text x="352" y="406" font-size="21" font-family="monospace">1 × 8 × 1 × 1</text>
<text x="650" y="406" font-size="21" font-family="monospace">1 × 8</text>
<path d="M42 425H918" stroke="#dce2e7"/>
<text x="42" y="461" font-size="22" font-weight="700">Linear</text>
<text x="352" y="461" font-size="21" font-family="monospace">1 × 8</text>
<text x="650" y="461" font-size="21" font-family="monospace">1 × 4</text>
<path d="M42 480H918" stroke="#dce2e7"/>
<text x="42" y="532" font-size="19" fill="#186078">FLOAT32 · RANDOMLY INITIALIZED FIXTURE</text>
<text x="42" y="568" font-size="18" fill="#526273">Recorded tensor shapes from a real run. Reproduction script and JSON available.</text>
<text x="42" y="595" font-size="16" fill="#526273">Profiling example; no optimization or accuracy comparison.</text>
</g></svg>